# Configuración para el Nginx del VPS (reverse proxy externo)
# Copiar a: /etc/nginx/sites-available/panel-admin
# Luego: ln -s /etc/nginx/sites-available/panel-admin /etc/nginx/sites-enabled/
# Certificado TLS: certbot --nginx -d admin.baifostudio.com

server {
    listen 80;
    server_name admin.baifostudio.com;

    # Redirigir todo HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.baifostudio.com;

    # Certificados Let's Encrypt (certbot los rellena automáticamente)
    ssl_certificate /etc/letsencrypt/live/admin.baifostudio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.baifostudio.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Rate limiting en login (5 req/min por IP)
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
