server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Seguridad: headers HTTP
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://iogurdgwuodqtnffimjk.supabase.co wss://iogurdgwuodqtnffimjk.supabase.co; img-src 'self' data:;" always;

    # Caché para assets estáticos (Vite genera hashes en el nombre)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: redirigir todo al index.html para React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Bloquear acceso a archivos ocultos
    location ~ /\. {
        deny all;
        return 404;
    }

    # Comprimir respuestas
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;
}
